name: Desi Culture Auto Poster

on:
  schedule:
    # 11:30 AM IST = 06:00 UTC
    # 06:00 PM IST = 12:30 UTC
    # 10:15 PM IST = 16:45 UTC
    - cron: '0 6 * * *'
    - cron: '30 12 * * *'
    - cron: '45 16 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Poster Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_PROFILE_ID: ${{ secrets.BUFFER_PROFILE_ID }}
        run: python bot.py
        
